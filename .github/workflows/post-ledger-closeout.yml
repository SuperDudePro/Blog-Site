name: Post ledger closeout

on:
  pull_request_target:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Merged Publisher PR number to retry
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: post-ledger-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  reconcile:
    if: >-
      (github.event_name == 'pull_request_target' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'publisher/')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    uses: ./.github/workflows/publisher-ledger-reusable.yml
    with:
      pr_number: ${{ format('{0}', github.event.pull_request.number || inputs.pr_number) }}
      implementation_ref: ${{ github.sha }}
    secrets:
      WILBERT_LEDGER_TOKEN: ${{ secrets.WILBERT_LEDGER_TOKEN }}
