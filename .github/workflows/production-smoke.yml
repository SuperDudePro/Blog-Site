name: Production smoke

on:
  push:
    branches: [main]
    paths-ignore: ['publisher/**']
  pull_request:
    paths-ignore: ['publisher/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check production after deployment
        run: node scripts/smoke-production.mjs
        env:
          DEPLOY_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          SMOKE_BROWSER: '1'
