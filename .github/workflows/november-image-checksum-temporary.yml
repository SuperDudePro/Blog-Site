name: Temporary November image checksum verification
on:
  push:
    branches:
      - publisher/2000-or-so-things-november-2026
  workflow_dispatch:
jobs:
  image-digests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout approved draft
        uses: actions/checkout@v4
      - name: Verify approved image bytes and geometry
        run: |
          set -euo pipefail
          dir=src/content/posts/2000-or-so-things-november-2026
          sha256sum "$dir/card-image.webp" "$dir/hero-image.webp" "$dir/body-image-1.webp"
          file "$dir/card-image.webp" "$dir/hero-image.webp" "$dir/body-image-1.webp"
          git hash-object "$dir/card-image.webp" "$dir/hero-image.webp" "$dir/body-image-1.webp"
