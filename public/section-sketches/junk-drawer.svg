<path d="M79 199q88 8 184-4v61q-85 8-181 1Z" fill="url(#grain)" stroke-width=".85" stroke-opacity=".6"/>
<path d="M85 213q42-2 61 1m47-1q28-4 64-7M92 242q44 4 89 2m21-2q22 0 52-4" fill="none" stroke-width=".7" stroke-opacity=".49"/>
