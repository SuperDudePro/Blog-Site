<path d="M56 131 101 167 252 164 277 131 271 229 75 237Z" fill="#c0b4a6" fill-opacity=".22" stroke-width="2.2"/>
<path d="M56 132 101 167 102 200 76 237 71 188Z" fill="url(#hatch)" stroke-width="1.65"/>
<path d="M253 164 277 132 270 229 251 229Z" fill="url(#hatch)" stroke-width="1.65"/>
<path d="M68 141 106 176 248 174 267 144" fill="none" stroke-width="1.1"/>
<!-- scattered paper behind contents -->
<path d="M104 133 109 78 178 85 174 150Z" fill="#f5f0e6" fill-opacity=".38" stroke-width="1.7" transform="rotate(-7 140 116)"/>
<path d="M110 94 156 98M112 105 160 109M116 118 153 123M121 130 145 132" fill="none" stroke-width="1.05" stroke-opacity=".45"/>
<path d="M169 113 188 73 250 96 230 150Z" fill="#eee8df" fill-opacity=".43" stroke-width="1.8"/>
<path d="M181 108 191 90 236 103 224 133Z" fill="url(#hatch)" stroke-width=".8"/>
<path d="M183 123q10-18 22-7 11-14 23 6" fill="none" stroke-width="1.05"/>
