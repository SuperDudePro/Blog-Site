<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" role="img" aria-labelledby="title desc">
<title id="title">Junk Drawer</title><desc id="desc">An old wooden drawer partly open, full of little keepsakes: an old photograph, loose notes, a key, a pencil, and a guitar pick, drawn in charcoal-like ink on a transparent background.</desc>
<defs>
  <filter id="pencil" x="-12%" y="-12%" width="124%" height="124%"><feTurbulence type="fractalNoise" baseFrequency=".63" numOctaves="2" seed="12" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale=".75" xChannelSelector="R" yChannelSelector="G"/></filter>
  <pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-22)"><path d="M0 0V9" stroke="#514b49" stroke-opacity=".27" stroke-width=".7"/></pattern>
  <pattern id="grain" width="14" height="8" patternUnits="userSpaceOnUse"><path d="M1 2c3-2 6 1 11-1M3 6c2-1 5 0 8-1" fill="none" stroke="#655e58" stroke-opacity=".31" stroke-width=".7"/></pattern>
</defs>
<g filter="url(#pencil)" stroke="#494440" stroke-linejoin="round" stroke-linecap="round">
<!-- cabinet back: intentionally no backdrop -->
<path d="M49 115 71 93 265 100 280 121 264 144 76 146Z" fill="#a39a91" fill-opacity=".16" stroke-width="2.3"/>
<path d="M55 116 69 100 262 104 273 120" fill="none" stroke-width=".95" stroke-opacity=".68"/>
<path d="M68 102 72 114 258 119 264 104M75 139 260 137" fill="none" stroke-width=".9" stroke-opacity=".5"/>
