<path d="M139 133 198 124 203 149 142 159Z" fill="#82718c" fill-opacity=".22" stroke-width="1.6"/>
<path d="M147 140 189 134M148 146 177 141" fill="none" stroke-width=".8" stroke-opacity=".7"/>
<!-- old-fashioned key -->
<path d="M93 159q-9-8-1-17 8-9 17-2 7 8 0 16l-4 3 28 24 7-6 7 6-7 7 7 7-9 7-42-40" fill="none" stroke-width="3.1"/>
<path d="M98 146q6-4 7 3-1 7-7 3" fill="none" stroke-width="1.2"/>
<!-- spiral of old cable -->
<path d="M202 151q23-13 33 5 12 18-8 29-19 8-30-6 0-13 16-14 14 0 11 10-2 8-10 3" fill="none" stroke-width="2.3"/>
<!-- pencil -->
<path d="M119 177 188 158 191 163 123 184 113 184Z" fill="#c3b49d" fill-opacity=".4" stroke-width="1.65"/>
<path d="M124 181 187 163M116 182l-7 7 4-11" fill="none" stroke-width=".9"/>
<!-- pick -->
<path d="M181 178q12-18 28-6 9 10 1 24-8 14-17 16-10-10-12-34Z" fill="#7b688c" fill-opacity=".4" stroke-width="2"/>
<path d="M189 179q4-5 10-2" fill="none" stroke="#766984" stroke-width=".9"/>
<!-- buttons -->
<circle cx="152" cy="182" r="9" fill="#ebe5dd" fill-opacity=".57" stroke-width="1.6"/><circle cx="149" cy="179" r="1.3" fill="#494440"/><circle cx="155" cy="185" r="1.3" fill="#494440"/>
<circle cx="170" cy="192" r="6.5" fill="#eee9e4" fill-opacity=".55" stroke-width="1.4"/>
<path d="M168 190l3 3m0-3-3 3" stroke-width=".75"/>
<!-- front -->
